<!-- 
    DOCTYPE serve para informar ao navegador qual versão do HTML
    está sendo utilizada no documento.
    Neste caso, <!DOCTYPE html> indica que estamos utilizando HTML5.
-->
<!DOCTYPE html>


<!--
    A tag <html> representa o início e o elemento principal de todo
    o documento HTML.

    O atributo lang define o idioma principal da página.
    pt-BR significa Português do Brasil.
-->
<html lang="pt-BR">


<head>
    <!--
        A tag <head> é o cabeçalho de configurações do documento.

        Dentro dela ficam informações importantes sobre a página,
        como codificação de caracteres, configurações de responsividade,
        título da página, links para arquivos CSS, entre outras.

        Normalmente, essas informações não aparecem diretamente
        como conteúdo visível na página.
    -->


    <!--
        A tag <meta charset="UTF-8"> define a codificação de caracteres
        utilizada pela página.

        O UTF-8 permite que o navegador reconheça corretamente
        caracteres especiais, como acentos, cedilha (ç) e símbolos.
    -->
    <meta charset="UTF-8">


    <!--
        A meta viewport configura como a página será exibida
        em diferentes tamanhos de tela, principalmente em celulares.

        width=device-width:
        define que a largura da página deve acompanhar a largura
        da tela do dispositivo.

        initial-scale=1.0:
        define o nível inicial de zoom da página como 100%.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!--
        A tag <title> define o título da página.

        Esse título aparece na aba do navegador e também é utilizado
        pelos navegadores para identificar a página.
    -->
    <title>Olá Mundo</title>

</head>


<body>
    <!--
        A tag <body> representa o corpo da página.

        Dentro dela colocamos todo o conteúdo que será exibido
        para o usuário, como textos, títulos, imagens, botões,
        links, formulários, entre outros elementos.
    -->

    Olá mundo. Este é meu projeto teste

</body>


<!-- A tag </html> indica o final do documento HTML. -->
</html>
