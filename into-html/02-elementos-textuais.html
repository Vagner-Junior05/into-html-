<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elementos Textuais</title>
</head>

<body>

    <h1>Aprendendo sobre elementos textuais</h1>

    <!--
        A tag <hr> cria uma separação temática no conteúdo.
        Normalmente é exibida pelo navegador como uma linha horizontal.
    -->
    <hr>


    <h2>O que são os elementos textuais?</h2>

    <!--
        Os elementos textuais são utilizados para organizar,
        destacar ou atribuir significado a partes específicas
        de um conteúdo.
    -->
    <p>
        Os elementos textuais servem para destacar, enfatizar
        ou dar um significado a partes específicas do conteúdo.
    </p>


    <h3>Elemento strong</h3>

    <!--
        A tag <strong> indica que determinado conteúdo possui
        forte importância dentro do texto.

        Por padrão, os navegadores normalmente exibem o conteúdo
        de <strong> em negrito.
    -->
    <p>
        É muito <strong>importante</strong> aprender a estrutura do HTML.
    </p>

</body>

</html>
